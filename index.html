<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha To-Do List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body>
    <!-- Cabeçalho -->
    <header class="bg-primary text-white py-4">
        <div class="container d-flex align-items-center gap-3">
            <img src="assets/Verificado.png" alt="Logo da lista" class="header-logo">
            <div>
                <h1 class="mb-1 header-title">Minha To-Do List</h1>
                <p class="mb-0">
                    Organize suas tarefas do dia
                </p>
            </div>
        </div>
    </header>
    <!-- Conteúdo principal -->
    <main class="container my-5">
        <!-- Seção de cadastro -->
        <section class="mb-5">
            <h2 class="mb-4">Adicionar tarefa</h2>
            <form id="form-tarefa">
                <div class="row g-2 align-items-end">
                    <div class="col-md-4">
                        <label for="tarefa" class="form-label">Nome da tarefa</label>
                        <input
                            type="text"
                            id="tarefa"
                            class="form-control"
                            placeholder="Digite uma tarefa..."
                            autocomplete="off">
                    </div>
                    <div class="col-md-2">
                        <label for="hora-tarefa" class="form-label">Hora</label>
                        <input
                            type="time"
                            id="hora-tarefa"
                            class="form-control"
                            aria-label="Hora do lembrete"
                            title="Hora do lembrete">
                    </div>
                    <div class="col-md-3">
                        <div class="form-check mt-2">
                            <input class="form-check-input" type="checkbox" id="toggle-data-tarefa">
                            <label class="form-check-label" for="toggle-data-tarefa">
                                Adicionar data específica
                            </label>
                        </div>
                        <div id="campo-data-tarefa" class="mt-2" style="display: none;">
                            <label for="data-tarefa" class="form-label">Data específica</label>
                            <input
                                type="date"
                                id="data-tarefa"
                                class="form-control"
                                aria-label="Data da tarefa"
                                title="Data da tarefa">
                        </div>
                    </div>
                    <div class="col-md-12 mt-2">
                        <label class="form-label d-block">Dias da semana</label>
                        <div id="dias-selecionados" class="d-flex flex-wrap gap-2">
                            <label class="form-check form-check-inline"><input class="form-check-input" type="checkbox" value="0"> Dom</label>
                            <label class="form-check form-check-inline"><input class="form-check-input" type="checkbox" value="1"> Seg</label>
                            <label class="form-check form-check-inline"><input class="form-check-input" type="checkbox" value="2"> Ter</label>
                            <label class="form-check form-check-inline"><input class="form-check-input" type="checkbox" value="3"> Qua</label>
                            <label class="form-check form-check-inline"><input class="form-check-input" type="checkbox" value="4"> Qui</label>
                            <label class="form-check form-check-inline"><input class="form-check-input" type="checkbox" value="5"> Sex</label>
                            <label class="form-check form-check-inline"><input class="form-check-input" type="checkbox" value="6"> Sáb</label>
                        </div>
                    </div>
                    <div class="col-md-1">
                        <button type="submit" class="btn btn-primary w-100">Adicionar</button>
                    </div>
                </div>
            </form>
        </section>
        <!-- Seção da lista -->
        <section>
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="mb-0">
                    Minhas tarefas
                </h2>
                <span
                    id="contador"
                    class="badge text-bg-secondary">
                    0 tarefas
                </span>
            </div>
            <!-- Tabela de tarefas -->
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>#</th>
                            <th>Tarefa</th>
                            <th>Hora</th>
                            <th>Data</th>
                            <th>Dias</th>
                            <th>Status</th>
                            <th class="text-center">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="lista-tarefas">
                        <!--
                            As tarefas serão inseridas
                            pelo JavaScript.
                        -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>
    <!-- Rodapé -->
    <footer class="bg-light text-center py-4">
        <p class="mb-0 text-muted">
            To-Do List - JavaScript + DOM + LocalStorage
        </p>
    </footer>

    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Ativar modo escuro">
        🌙
    </button>

    <div id="modal-editar" class="custom-modal hidden" aria-hidden="true">
        <div class="custom-modal-content">
            <h3>Editar tarefa</h3>
            <form id="form-editar">
                <input type="hidden" id="editar-id">

                <div class="mb-3">
                    <label for="editar-tarefa" class="form-label">Nome da tarefa</label>
                    <input type="text" id="editar-tarefa" class="form-control" required>
                </div>

                <div class="row g-2">
                    <div class="col-md-12">
                        <label for="editar-hora" class="form-label">Hora</label>
                        <input type="time" id="editar-hora" class="form-control">
                    </div>
                </div>

                <div class="mt-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="toggle-editar-data">
                        <label class="form-check-label" for="toggle-editar-data">
                            Adicionar data específica
                        </label>
                    </div>
                    <div id="campo-editar-data" class="mt-2" style="display: none;">
                        <label for="editar-data" class="form-label">Data específica</label>
                        <input type="date" id="editar-data" class="form-control">
                    </div>
                </div>

                <div class="mt-3">
                    <label class="form-label d-block">Dias da semana</label>
                    <div id="editar-dias" class="d-flex flex-wrap gap-2">
                        <label class="form-check form-check-inline"><input class="form-check-input" type="checkbox" value="0"> Dom</label>
                        <label class="form-check form-check-inline"><input class="form-check-input" type="checkbox" value="1"> Seg</label>
                        <label class="form-check form-check-inline"><input class="form-check-input" type="checkbox" value="2"> Ter</label>
                        <label class="form-check form-check-inline"><input class="form-check-input" type="checkbox" value="3"> Qua</label>
                        <label class="form-check form-check-inline"><input class="form-check-input" type="checkbox" value="4"> Qui</label>
                        <label class="form-check form-check-inline"><input class="form-check-input" type="checkbox" value="5"> Sex</label>
                        <label class="form-check form-check-inline"><input class="form-check-input" type="checkbox" value="6"> Sáb</label>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <button type="button" id="cancelar-edicao" class="btn btn-secondary">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modal-confirmacao" class="custom-modal hidden" aria-hidden="true">
        <div class="custom-modal-content modal-confirmation">
            <h3>Excluir tarefa</h3>
            <p id="confirmacao-texto">Deseja realmente excluir esta tarefa?</p>
            <div class="d-flex justify-content-end gap-2 mt-4">
                <button type="button" id="cancelar-exclusao" class="btn btn-secondary">Cancelar</button>
                <button type="button" id="confirmar-exclusao" class="btn btn-danger">Excluir</button>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>
